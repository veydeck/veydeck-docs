components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: veydeck_session
  responses:
    BadRequest:
      description: 请求参数或业务状态不合法。
      content: { application/json: { schema: { $ref: '#/components/schemas/ApiResponse' } } }
    Unauthorized:
      description: 未登录或会话无效。
      content: { application/json: { schema: { $ref: '#/components/schemas/ApiResponse' } } }
    NotFound:
      description: 目标资源不存在。
      content: { application/json: { schema: { $ref: '#/components/schemas/ApiResponse' } } }
    Conflict:
      description: 目标资源存在状态冲突。
      content: { application/json: { schema: { $ref: '#/components/schemas/ApiResponse' } } }
  schemas:
    ApiResponse:
      type: object
      required: [success, code, message]
      properties:
        success: { type: boolean }
        code: { type: integer }
        message: { type: string }
        messageKey: { type: [string, 'null'] }
        errorCode: { type: [string, 'null'] }
        data: {}
    SuiteInstallTaskResponse:
      type: object
      required: [taskId, instanceId]
      properties:
        taskId: { type: string }
        instanceId: { type: string }
    SuiteInstallProgressResponse:
      type: object
      required:
        [taskId, instanceId, nodeId, progressPercent, status, currentStep, isFinished, cancelRequested]
      properties:
        taskId: { type: string }
        instanceId: { type: string }
        nodeId: { type: string }
        progressPercent: { type: integer, minimum: 0, maximum: 100 }
        status: { type: string, enum: [queued, running, canceling, success, failed, canceled] }
        currentStep: { type: string }
        currentImage: { type: [string, 'null'] }
        isFinished: { type: boolean }
        error: { type: [string, 'null'] }
        cancelRequested: { type: boolean }
    SuiteCompatibilityCheckRequest:
      type: object
      additionalProperties: false
      properties:
        nodeIds: { type: array, items: { type: string } }
    SuiteCompatibilityInstance:
      type: object
      additionalProperties: false
      required: [instanceId, suiteId, suiteName, nodeId, nodeName, platformContractVersion, status, reason]
      properties:
        instanceId: { type: string }
        suiteId: { type: string }
        suiteName: { type: string }
        nodeId: { type: string }
        nodeName: { type: string }
        platformContractVersion: { type: integer, minimum: 1 }
        status: { type: string, enum: [compatible, incompatible] }
        reason: { type: string, enum: [supported, contractVersionNotSupported] }
    SuiteCompatibilitySummary:
      type: object
      additionalProperties: false
      required: [total, compatible, incompatible]
      properties:
        total: { type: integer, minimum: 0 }
        compatible: { type: integer, minimum: 0 }
        incompatible: { type: integer, minimum: 0 }
    SuiteCompatibilityReport:
      type: object
      additionalProperties: false
      required: [releaseVersion, supportedSuiteContractVersions, compatible, summary, instances]
      properties:
        releaseVersion: { type: string }
        supportedSuiteContractVersions:
          type: array
          minItems: 1
          uniqueItems: true
          items: { type: integer, minimum: 1 }
        compatible: { type: boolean }
        summary: { $ref: '#/components/schemas/SuiteCompatibilitySummary' }
        instances:
          type: array
          items: { $ref: '#/components/schemas/SuiteCompatibilityInstance' }
    NodePrecheckRequest:
      type: object
      required: [addr, port, user, authMode, servicePort, installDir]
      properties:
        addr: { type: string }
        port: { type: string }
        user: { type: string }
        authMode: { type: string, enum: [password, key] }
        pwd: { type: string, writeOnly: true }
        servicePort: { type: string }
        installDir: { type: string }
        veydeckUrl: { type: string, format: uri }
    RuntimeCompatibilityRequest:
      type: object
      required: [compatibility]
      additionalProperties: true
      properties:
        compatibility:
          type: object
          required: [agentVersion, runtimeProtocolVersion, minSupportedControllerVersion]
          properties:
            agentVersion: { type: string }
            runtimeProtocolVersion: { type: string }
            minSupportedControllerVersion: { type: string }
    LoginRequest:
      type: object
      required: [username, password]
      properties:
        username: { type: string }
        password: { type: string, writeOnly: true }
    LogQuery:
      type: object
      additionalProperties: true
      properties:
        page: { type: integer, minimum: 1 }
        pageSize: { type: integer, minimum: 1 }
        modules: { type: array, items: { type: string } }
        actions: { type: array, items: { type: string } }
        actionPrefixes: { type: array, items: { type: string } }
        statuses: { type: array, items: { type: string } }
        startAt: { type: integer }
        endAt: { type: integer }
        keyword: { type: string }
    NotificationCreateRequest:
      type: object
      required: [level, message]
      properties:
        level: { type: string, enum: [success, info, warning, error] }
        message: { type: string }
