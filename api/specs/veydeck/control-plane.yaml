        lifecycle: active
        implementationStatus: verified
        source: { repository: veydeck, file: crates/veydeck/src/api/nodes.rs }
        designDocs: []
        reviewedAt: "2026-06-27"
        notes: ''
  /node/{node_id}/deploy:
    post:
      operationId: veydeckNodeDeploy
      tags: [节点管理]
      summary: 部署已有节点
      description: 对已存在节点发起部署，并在写入配置或重启前检查目标机冲突。
      security: [{ cookieAuth: [] }]
      parameters:
        - name: node_id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                veydeckUrl: { type: string, format: uri }
      responses:
        '200': { description: 节点部署任务已创建, content: { application/json: { schema: { $ref: '#/components/schemas/ApiResponse' } } } }
        '404': { $ref: '#/components/responses/NotFound' }
      x-veydeck:
        owner: veydeck
        layer: control-plane
        lifecycle: active
        implementationStatus: unverified
        source: { repository: veydeck, file: crates/veydeck/src/api/nodes.rs }
        designDocs: [architecture/Veydeck分布式部署与节点管理路线图.md]
        reviewedAt: null
        notes: ''
  /node/{node_id}/deploy-progress:
